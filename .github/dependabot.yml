# Dependency updates, one pull request per ecosystem rather than one per package.
#
# Everything an ecosystem has to offer goes into a single group, majors
# included: this is a small static site with a full build-and-serve smoke test
# on every PR, so a batched bump either passes that check or it does not, and
# chasing the culprit across a handful of dependencies is cheaper than reviewing
# a dozen separate branches.

version: 2

updates:
  # The site itself — pnpm, resolved from pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    ignore:
      # svelte-check cannot run against TypeScript 7 on its own: it wants 6 as
      # `typescript` and 7 aliased as `@typescript/native`, driven by --tsgo.
      # That is how package.json is set up, so a straight bump of `typescript`
      # to 7 would break `pnpm check` again. Drop this once svelte-check
      # supports TypeScript 7 as the only installed version.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # The actions used by .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  # Both stages of the Dockerfile: the node build image and the nginx runtime.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']
