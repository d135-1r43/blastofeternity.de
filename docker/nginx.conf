# Serves the prerendered site out of /usr/share/nginx/html.
#
# The build is plain HTML: every route is a directory with an index.html, so
# clean URLs resolve without any rewriting beyond `$uri/index.html`. Everything
# below that is caching and the legacy redirects that `static/_redirects`
# carries for Netlify and Cloudflare Pages.

server {
	listen 8080;
	listen [::]:8080;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Nothing here is a secret, but the version number is noise.
	server_tokens off;

	# The container listens on 8080 behind whatever port or proxy the host maps
	# in front of it, so redirects must not name a host and port of their own.
	absolute_redirect off;

	# Legacy URLs from the Webflow site — keep in step with static/_redirects.
	location = /historie { return 301 /impressum/; }
	location = /boe      { return 301 /boe/; }
	location = /uber-uns { return 301 /uber-uns/; }

	# Fingerprinted bundles and fonts never change under the same name.
	location /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		access_log off;
	}

	location /fonts/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		access_log off;
	}

	location /images/ {
		add_header Cache-Control "public, max-age=2592000" always;
		access_log off;
	}

	# HTML is rebuilt on every content change, so it must be revalidated.
	location / {
		try_files $uri $uri/index.html $uri/ =404;
		add_header Cache-Control "public, max-age=0, must-revalidate";
	}

	# A directory with no index would otherwise be a 403, which tells a visitor
	# more than it needs to and looks nothing like the rest of the site.
	error_page 403 =404 /404.html;
	error_page 404 /404.html;
	location = /404.html {
		internal;
	}

	# For container health checks — no body, no log line.
	location = /healthz {
		access_log off;
		return 200 "ok\n";
		add_header Content-Type text/plain;
	}

	gzip on;
	gzip_vary on;
	gzip_min_length 512;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
}
